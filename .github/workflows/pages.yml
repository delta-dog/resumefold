# Builds the static site (including the in-browser TeX bundle) and publishes it
# to GitHub Pages when started manually. Project pages live under /<repo>/, so
# BASE_PATH is set from the repository name.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The TeX engine + tree (~250 MB of downloads, trimmed to 43 MB) is cached between runs.
      - uses: actions/cache@v4
        with:
          path: .tex-cache
          key: tex-cache-${{ hashFiles('scripts/tex/build-bundle.mjs') }}
      - run: npm run tex:bundle
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
